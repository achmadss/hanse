name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: golangci-lint
        if: runner.os == 'Linux'
        # Built from source with the repository's toolchain, because the
        # golangci-lint release binaries trail the newest Go release: a
        # v2.15.0 binary built with Go 1.26 refuses to lint a Go 1.27.3
        # module ("the Go language version used to build golangci-lint is
        # lower than the targeted Go version"). go run compiles v2.15.0
        # with the setup-go toolchain instead.
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - run: go test ./...

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make cross

  release-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Installs the prebuilt GoReleaser binary: compiling it with `go run`
      # costs several minutes on a cold module cache.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.19.0"
          install-only: true
      # Builds a GoReleaser snapshot and asserts the hanse-gateway archive
      # carries capabilities/ and config/, with handler scripts still
      # executable in the tar.gz.
      - run: ./scripts/check-release-archive.sh
        env:
          GORELEASER: goreleaser
