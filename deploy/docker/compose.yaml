# Example Docker Compose deployment of the Hanse Gateway.
#
# Recommended layout: gateway.yaml names the host node in `node` and sets
# `embedded_agent: false`, and the host runs hanse-node for that same node,
# joining with `hanse-gateway node enroll`. The host node's exec handlers then
# run on its agent, not in this container. http handlers still run in the
# Gateway process, which calls their endpoint itself.
#
# Copy config/gateway.example.yaml, config/nodes.example.yaml and
# config/routes.example.yaml into ./config/ next to this file, adjust the
# paths inside gateway.yaml to /etc/hanse/..., set `node` to the host node ID
# and `embedded_agent: false`, and list that node in nodes.yaml and
# routes.yaml. Put the capability packages and secret files there too. See
# docs/guides/docker.md.
#
# Every value here is a placeholder: gateway.example.com for the public host
# name and 192.0.2.0/24 for addresses.

services:
  gateway:
    # Built from this checkout: `docker compose up --detach --build`. The
    # repository does not publish an image yet; a future release can publish
    # one and this example can use it instead:
    #   image: ghcr.io/achmadss/hanse-gateway:<version>
    build:
      context: ../..
      dockerfile: Dockerfile
    image: hanse-gateway:local
    container_name: hanse-gateway
    restart: unless-stopped
    # A tiny init is PID 1: it forwards SIGTERM and reaps any process. With
    # `embedded_agent: false` the Gateway starts no handler, so it mainly
    # forwards the signal.
    init: true

    # The Gateway runs as uid/gid 10001 in the image and needs no write
    # access outside /var/lib/hanse.
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Publish only on loopback, and put a TLS reverse proxy in front (see
    # docs/guides/reverse-proxy.md). To reach the Gateway from other
    # machines directly, serve TLS itself instead.
    ports:
      - "127.0.0.1:8443:8443"

    # A Gateway with `embedded_agent: false` runs no exec handler itself, so
    # it needs no host network. Wake-on-LAN and other LAN handlers run on
    # the host through its hanse-node agent. Keep host networking only for
    # the embedded-agent layout (the default) with LAN handlers: remove the
    # ports block above and uncomment this line.
    # network_mode: host

    volumes:
      # Configuration, capability packages, credentials, and TLS files. The
      # directory is read-only: the Gateway never writes it.
      - ./config:/etc/hanse:ro
      # The history database, the enrollment database, and the tokens file.
      - hanse-state:/var/lib/hanse

    tmpfs:
      - /tmp:size=64m

    healthcheck:
      # /healthz needs no token. This command assumes plain HTTP on a
      # listen address reachable from inside the container, such as
      # 0.0.0.0:8443 with allow_insecure_http: true. With TLS, use
      # https://127.0.0.1:8443/healthz and add
      # --no-check-certificate; see docs/guides/docker.md.
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  hanse-state:
