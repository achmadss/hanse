# Hanse Gateway configuration. See docs/configuration.md.
version: 1

# The node in nodes.yaml that is this Gateway host. Its exec handlers run in
# the Gateway's embedded agent, and this machine needs no separate hanse-node.
#
# Leave it out to run no handler in the Gateway process: every exec handler
# then runs on a node agent, including the handlers of this machine. That is
# the layout for a Gateway in a container. See docs/guides/docker.md.
node: gateway

# The URL that clients and node agents use to reach the Gateway.
public_url: https://gateway.example.com

listen: 0.0.0.0:8443
tls:
  cert_file: /etc/hanse/tls/cert.pem
  key_file: /etc/hanse/tls/key.pem
# Set to true only when the Gateway listens on loopback behind a TLS reverse proxy.
allow_insecure_http: false

paths:
  nodes: nodes.yaml
  routes: routes.yaml
  capabilities:
    - /etc/hanse/capabilities
  credentials_dir: /etc/hanse/credentials
  state_dir: /var/lib/hanse

auth:
  tokens_file: /var/lib/hanse/tokens.json

history:
  retention: 30d

timeouts:
  operation: 5m
  options: 10s
  grace_period: 10s

limits:
  response_size: 1MiB
  log_line: 16KiB
  log_total: 10MiB
  summary: 1KiB
  error_message: 4KiB

handlers:
  env_allow: []

agents:
  join_token_ttl: 15m
  reconnect_window: 5m
  heartbeat_interval: 15s
  heartbeat_timeout: 45s

log:
  level: info
  format: text
