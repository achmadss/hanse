# Hanse Gateway configuration. See docs/configuration.md.
version: 1

# The node in nodes.yaml that is this Gateway host. Its http handlers always
# run in the Gateway process, and its exec handlers run there too while
# embedded_agent is true.
node: gateway

# Run this host node's exec handlers inside the Gateway process. Set it to
# false when the host runs hanse-node for the same node, such as for a Gateway
# in a container: exec handlers then run on that node's agent, and http
# handlers still run in the Gateway process. See docs/guides/docker.md.
embedded_agent: true

# The URL that clients and node agents use to reach the Gateway.
public_url: https://gateway.example.com

listen: 0.0.0.0:8443
tls:
  cert_file: /etc/hanse/tls/cert.pem
  key_file: /etc/hanse/tls/key.pem
# Set to true only for a non-loopback listen address without TLS, behind a
# TLS reverse proxy. A loopback address needs no flag.
allow_insecure_http: false

paths:
  nodes: nodes.yaml
  routes: routes.yaml
  capabilities:
    - /etc/hanse/capabilities
  credentials_dir: /etc/hanse/credentials
  state_dir: /var/lib/hanse

auth:
  tokens_file: /var/lib/hanse/tokens.json

history:
  retention: 30d

timeouts:
  operation: 5m
  options: 10s
  grace_period: 10s

limits:
  response_size: 1MiB
  log_line: 16KiB
  log_total: 10MiB
  summary: 1KiB
  error_message: 4KiB

handlers:
  env_allow: []

agents:
  join_token_ttl: 15m
  reconnect_window: 5m
  heartbeat_interval: 15s
  heartbeat_timeout: 45s

log:
  level: info
  format: text
